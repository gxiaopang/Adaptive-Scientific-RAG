[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-scientific-rag"
version = "0.1.0"
description = "An evaluation-first scientific retrieval-augmented generation system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "anyio>=4.6,<4.7",
    "bm25s>=0.2.14,<0.3",
    "fastapi>=0.115,<0.117",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "openai>=2,<3",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "ranx>=0.3.20,<0.4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "types-pyyaml>=6,<7",
]
eval = [
    "langchain-community>=0.3.31,<0.4",
    "ragas>=0.4,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: requires explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
show_error_codes = true
warn_unused_configs = true
